# 로컬 개발용 MySQL
# 앱을 실행하면 Spring Boot 가 자동으로 띄우고 꺼요. (Docker Desktop 이 켜져 있어야 해요)
# 직접 띄우려면: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zippick
      MYSQL_USER: zippick
      MYSQL_PASSWORD: zippick
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "3307:3306" # PC에 깔린 MySQL(3306)과 안 겹치게 3307
    volumes:
      - zippick-mysql-data:/var/lib/mysql

volumes:
  zippick-mysql-data:
