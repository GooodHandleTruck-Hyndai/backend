spring:
  application:
    name: zippick
  profiles:
    active: local
  jackson:
    time-zone: Asia/Seoul
  config:
    import: optional:file:.env[.properties]

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  base-url: https://dapi.kakao.com
  connect-timeout: 2s
  read-timeout: 3s

# 외부 API (#7 에서 추가). 키는 레포에 쓰지 말고 환경 변수로 넣어요.
zippick:
  molit:
    # 국토교통부 아파트 매매 실거래가 자료 (공공데이터포털 「일반 인증키(Decoding)」)
    service-key: ${MOLIT_SERVICE_KEY:}
  # 실거래 수집 배치 (#17 에서 추가). 기본은 꺼짐이라 테스트·CI 에서는 국토부를 부르지 않아요.
  collect:
    # 수집할 구 코드 5자리 (마포구 11440)
    sgg-cds: 11440
    # API 5번 시연 지역 사전 저장: 켜면 서버 시작 직후 최근 12개월을 넣어요
    preload:
      enabled: ${ZIPPICK_PRELOAD_ENABLED:false}
      months: 12
    # API 12번 재수집: 켜면 매일 04:00(KST)에 최근 3개월을 다시 받아요 (#18 에서 추가)
    refresh:
      enabled: ${ZIPPICK_REFRESH_ENABLED:false}
      months: 3
      cron: "0 0 4 * * *"
  # 행안부 주소정보 API (#40 에서 추가). 키는 레포에 쓰지 말고 환경 변수로 넣어요.
  # 검색 API 와 좌표제공 API 는 승인키가 따로 나와요
  juso:
    search-key: ${JUSO_SEARCH_KEY:}
    coord-key: ${JUSO_COORD_KEY:}
    # 좌표 없는 건물 채우기 배치. 기본은 꺼짐이라 테스트·CI 에서는 행안부를 부르지 않아요
    fill:
      enabled: ${ZIPPICK_JUSO_FILL_ENABLED:false}
      batch-size: 100
      delay-ms: 600000
  # 관심 건물 알림 만들기 (#18 에서 추가). 기본은 꺼짐이라 테스트·CI 에서는 안 돌아요
  alert:
    generate:
      enabled: ${ZIPPICK_ALERT_ENABLED:false}
      # 실거래 재수집(04:00) 다음에 돌아요
      cron: "0 30 4 * * *"
