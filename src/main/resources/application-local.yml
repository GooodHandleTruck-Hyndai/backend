# 로컬 개발용 설정. 비밀번호는 compose.yaml 과 같은 개발용 값이에요.
# 실제 서버 비밀번호는 절대 여기에 쓰지 말고 환경 변수로 넣어요.
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/sidong?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: sidong
    password: sidong
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false
