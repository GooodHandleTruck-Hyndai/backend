<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">집픽 시스템 구성</title>
  <desc id="d">플레오스 차량 앱이 집픽 API 서버를 호출하고, 서버는 MySQL에 실거래 데이터를 저장하며 국토부·행안부·카카오 API와 배치 작업을 사용한다</desc>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif; }
    .h { font-size: 19px; font-weight: 700; fill: #0E1726; }
    .s { font-size: 14px; fill: #4A5A70; }
    .c { font-size: 12.5px; fill: #6B7A90; }
    .lab { font-size: 12.5px; fill: #2F7E73; font-weight: 600; }
  </style>
  <!-- 배경: 흰 카드 (다크 모드에서도 읽히게 배경을 칠함) -->
  <rect width="1200" height="640" rx="18" fill="#FFFFFF" stroke="#DDE3EC"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A98AD"/>
    </marker>
  </defs>

  <g class="f">
    <text x="40" y="52" font-size="22" font-weight="700" fill="#0E1726">시스템 구성</text>
    <text x="40" y="78" class="c">현재 저장소(main) 코드 기준</text>

    <!-- 차량 앱 -->
    <rect x="40" y="200" width="250" height="230" rx="14" fill="#F4F7FB" stroke="#C9D3E0"/>
    <text x="64" y="236" class="h">차량 앱</text>
    <text x="64" y="262" class="s">플레오스 커넥트 (Android 14)</text>
    <text x="64" y="284" class="s">Kotlin · Jetpack Compose</text>
    <line x1="64" y1="304" x2="266" y2="304" stroke="#DDE3EC"/>
    <text x="64" y="330" class="c">플레오스 SDK</text>
    <text x="64" y="352" class="c">· 위치(FusedLocation) · 차량 기어·주행</text>
    <text x="64" y="372" class="c">· 음성 안내(TextToSpeech)</text>
    <text x="64" y="392" class="c">· 길 안내·도착(NaviHelper)</text>
    <text x="64" y="412" class="c">· 근접 알림</text>

    <!-- 앱 → 서버 -->
    <line x1="290" y1="315" x2="408" y2="315" stroke="#8A98AD" stroke-width="2" marker-end="url(#a)"/>
    <text x="300" y="300" class="lab">HTTPS · REST</text>
    <text x="300" y="338" class="c">X-Anonymous-Id</text>

    <!-- API 서버 -->
    <rect x="410" y="140" width="380" height="350" rx="14" fill="#FFFFFF" stroke="#2F7E73" stroke-width="2"/>
    <text x="434" y="176" class="h">집픽 API 서버</text>
    <text x="434" y="200" class="s">Spring Boot 4 · Java 17 · JPA · Swagger</text>
    <g>
      <rect x="434" y="218" width="160" height="96" rx="10" fill="#F4F7FB" stroke="#DDE3EC"/>
      <text x="448" y="242" font-size="14" font-weight="700" fill="#0E1726">건물·실거래</text>
      <text x="448" y="264" class="c">주변 건물 · 앞쪽 건물</text>
      <text x="448" y="282" class="c">상세 · 거래 내역</text>
      <text x="448" y="300" class="c">가격 추이</text>
      <rect x="606" y="218" width="160" height="96" rx="10" fill="#F4F7FB" stroke="#DDE3EC"/>
      <text x="620" y="242" font-size="14" font-weight="700" fill="#0E1726">사용자 기능</text>
      <text x="620" y="264" class="c">기기 등록(익명 ID)</text>
      <text x="620" y="282" class="c">저장 · 관심 조건</text>
      <text x="620" y="300" class="c">새 거래 알림 · 지역</text>
      <rect x="434" y="328" width="332" height="138" rx="10" fill="#EEF7F5" stroke="#CFE6E1"/>
      <text x="448" y="352" font-size="14" font-weight="700" fill="#0E1726">배치 작업</text>
      <text x="448" y="376" class="c">사전 저장 (서버 시작 시, 최근 12개월)</text>
      <text x="448" y="396" class="c">재수집 (매일 04:00, 최근 3개월)</text>
      <text x="448" y="416" class="c">새 거래 알림 생성 (매일 04:30)</text>
      <text x="448" y="436" class="c">건물 좌표 채우기 (행안부 주소 API)</text>
      <text x="448" y="456" class="c">설정으로 켜고 끔</text>
    </g>

    <!-- 서버 → DB -->
    <line x1="600" y1="490" x2="600" y2="538" stroke="#8A98AD" stroke-width="2" marker-end="url(#a)"/>
    <rect x="480" y="540" width="240" height="70" rx="12" fill="#F4F7FB" stroke="#C9D3E0"/>
    <text x="504" y="570" class="h">MySQL 8.4</text>
    <text x="504" y="594" class="c">건물 · 실거래 · 기기 · 저장 · 알림</text>

    <!-- 외부 API -->
    <text x="890" y="120" font-size="15" font-weight="700" fill="#4A5A70">외부 공공·지도 API</text>
    <rect x="890" y="140" width="270" height="92" rx="12" fill="#F4F7FB" stroke="#C9D3E0"/>
    <text x="910" y="170" font-size="15" font-weight="700" fill="#0E1726">국토교통부 실거래가</text>
    <text x="910" y="194" class="c">아파트 · 오피스텔 매매 (공공데이터포털)</text>
    <text x="910" y="214" class="c">시군구·월 단위로 받아 DB에 저장</text>

    <rect x="890" y="252" width="270" height="92" rx="12" fill="#F4F7FB" stroke="#C9D3E0"/>
    <text x="910" y="282" font-size="15" font-weight="700" fill="#0E1726">행정안전부 주소정보</text>
    <text x="910" y="306" class="c">도로명주소 검색 · 좌표 제공</text>
    <text x="910" y="326" class="c">건물 좌표를 찾아 DB에 저장</text>

    <rect x="890" y="364" width="270" height="92" rx="12" fill="#F4F7FB" stroke="#C9D3E0"/>
    <text x="910" y="394" font-size="15" font-weight="700" fill="#0E1726">카카오 로컬</text>
    <text x="910" y="418" class="c">좌표 → 시군구 · 주소 → 좌표</text>
    <text x="910" y="438" class="c">실시간 조회만, 결과 저장 안 함</text>

    <line x1="790" y1="186" x2="888" y2="186" stroke="#8A98AD" stroke-width="2" marker-end="url(#a)"/>
    <line x1="790" y1="298" x2="888" y2="298" stroke="#8A98AD" stroke-width="2" marker-end="url(#a)"/>
    <line x1="790" y1="410" x2="888" y2="410" stroke="#8A98AD" stroke-width="2" marker-end="url(#a)"/>
  </g>
</svg>
