# 서버(EC2) 배포: MySQL + 집픽 서버 + Caddy(https 자동 인증서) (#57 에서 추가)
#
#   docker compose -f compose.prod.yaml up -d --build
#
# - 비밀 값(카카오·국토부 키, DB 비밀번호, 도메인)은 같은 폴더의 .env 에만 둠 (저장소에 올리지 않음, DEPLOY.md 참고)
# - 포트: 80·443 만 외부 공개(Caddy). 서버 8080·MySQL 3306 은 내부망에서만 접근
# - 메모리 상한: t3.small(2GB) 실측 기준 (동시 20명 부하에서 서버 최대 430MB, DB 최대 518MB, #57 PR 참고)
name: zippick

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zippick
      MYSQL_USER: zippick
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 .env 에 없음}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD 가 .env 에 없음}
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      # 첫 실행(볼륨이 비어 있을 때)만 마포 시연 데이터 적재. 이후는 매일 재수집 배치로 최신화
      - ./e2e/seed:/docker-entrypoint-initdb.d:ro
      - zippick-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uzippick -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 700m
    restart: unless-stopped

  app:
    # 자동 배포: GitHub Actions 가 빌드해 ECR 에 올린 이미지(APP_IMAGE)를 받아서 교체 (2GB 서버에서 직접 빌드하지 않음)
    # 수동: APP_IMAGE 없이 실행하면 이 폴더 코드로 직접 빌드 (docker compose -f compose.prod.yaml up -d --build)
    image: ${APP_IMAGE:-zippick-backend:local}
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: server
      TZ: Asia/Seoul
    mem_limit: 800m
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    depends_on:
      - app
    ports:
      - "80:80"   # Let's Encrypt 인증서 발급 확인 + https 로 이동
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS 가 .env 에 없음}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data     # 발급받은 인증서 보관 (재배포해도 다시 발급 안 함 → 발급 한도 보호)
      - caddy-config:/config
    mem_limit: 128m
    restart: unless-stopped

volumes:
  zippick-mysql:
  caddy-data:
  caddy-config:
